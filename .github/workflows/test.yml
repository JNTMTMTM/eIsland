name: eIsland Unit Tests

on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'plugins/**'
      - 'cli/**'
      - 'i18n/**'
      - 'package*.json'
      - 'vitest.config.mts'
      - 'tsconfig*.json'
      - 'scripts/**'
      - '.github/workflows/test.yml'
  workflow_dispatch:
    inputs:
      project:
        description: Active unit test project
        type: choice
        default: all
        options: [all, shared, plugins, renderer, cli]

permissions:
  contents: read

concurrency:
  group: tauri-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (${{ matrix.project }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(inputs.project && inputs.project != 'all' && format('["{0}"]', inputs.project) || '["shared","plugins","renderer","cli"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install CLI dependencies
        if: matrix.project == 'cli'
        run: npm ci --prefix cli --ignore-scripts
      - uses: actions/setup-dotnet@v6
        if: matrix.project == 'plugins'
        with:
          dotnet-version: '10.0.x'
      - name: Prepare plugin test dependencies
        if: matrix.project == 'plugins'
        run: npm run test:plugins:build
      - name: Verify active and preserved test discovery
        if: matrix.project == 'plugins'
        run: npm run test:discovery
      - name: Run selected tests
        run: npm run test:${{ matrix.project }}
  native-api:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Test native API, runtime entry points and release tooling
        run: npm run test:api
      - name: Check translation consistency
        run: npm run i18n:check
      - name: Test lint configuration
        run: npm run lint:config:test
