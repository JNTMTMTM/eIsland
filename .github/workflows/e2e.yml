name: Tauri Desktop E2E

on:
  pull_request:
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'scripts/native/**'
      - 'scripts/test/**'
      - 'i18n/**'
      - 'resources/**'
      - 'plugins/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tauri-e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Tauri / WebView2 (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      TAURI_CONFIG: '{"identifier":"com.pyisland.eisland.ci"}'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install build dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Prepare WebView2
        shell: pwsh
        run: |
          $runtime = Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\*', 'HKCU:\Software\Microsoft\EdgeUpdate\Clients\*' -ErrorAction SilentlyContinue | Where-Object { $_.name -like '*WebView2*' -and $_.pv -and $_.pv -ne '0.0.0.0' }
          if (-not $runtime) {
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'MicrosoftEdgeWebview2Setup.exe'
            Invoke-WebRequest 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -OutFile $bootstrapper
            $install = Start-Process -FilePath $bootstrapper -ArgumentList '/silent', '/install' -WindowStyle Hidden -Wait -PassThru
            if ($install.ExitCode -ne 0) { throw "WebView2 install failed: $($install.ExitCode)" }
          }
      - name: Prepare native FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js
      - name: Publish native plugin resources
        run: npm run plugins:build
      - name: Test native Tauri API and Rust services
        run: npm run test:api && npm run test:rust
      - name: Check Rust services
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Build embedded Tauri test application
        run: npx tauri build --debug --no-bundle
      - name: Run real WebView2 desktop tests
        run: npm run test:e2e
        env:
          EISLAND_SMOKE_BINARY: ${{ github.workspace }}/src-tauri/target/debug/eisland.exe
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tauri-e2e-windows-x64
          path: src-tauri/target/smoke/
          if-no-files-found: ignore
