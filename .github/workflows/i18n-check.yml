name: eisland CI i18n Completeness Check

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      exit_code: ${{ steps.check.outputs.exit_code }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Run i18n completeness check
        id: check
        env:
          I18N_CHECK_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set +e
          npm run i18n:check -- --report i18n-check-report.md 2>&1 | tee i18n-check.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
          if [ ! -s i18n-check-report.md ]; then
            printf '## i18n 翻译完整性报告\n\n**❌ ERROR** · 检查未能生成报告，请查看工作流日志。\n' > i18n-check-report.md
          fi
          cat i18n-check-report.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload check report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i18n-check-report
          path: |
            i18n-check-report.md
            i18n-check.log
          if-no-files-found: warn

      - name: Fail workflow on missing translations
        if: steps.check.outputs.exit_code != '0'
        run: |
          echo "i18n completeness check failed. See log for details."
          exit 1

  comment-i18n-report:
    if: always() && github.event_name == 'pull_request_target'
    needs: i18n-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download check report
        uses: actions/download-artifact@v5
        with:
          name: i18n-check-report
          path: .

      - name: Comment i18n report on PR
        uses: actions/github-script@v7
        env:
          EXIT_CODE: ${{ needs.i18n-check.outputs.exit_code }}
        with:
          # Fall back to GITHUB_TOKEN when BOT_PAT is unavailable (e.g. fork PRs)
          github-token: ${{ secrets.BOT_PAT || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('node:fs');
            const marker = '<!-- i18n-check-report -->';

            const readReport = (path) => {
              try {
                const content = fs.readFileSync(path, 'utf8').trim();
                if (content) return content;
              } catch {
                // 报告不可用时仍发布可读的错误状态，并保留工作流入口。
              }
              return '## i18n 翻译完整性报告\n\n**❌ ERROR** · 未找到检查报告，请查看工作流日志。';
            };

            const exitCode = process.env.EXIT_CODE || '1';
            const status = exitCode === '0' ? 'PASS' : 'FAIL';
            const sha = context.payload.pull_request.head.sha;
            const shortSha = sha.slice(0, 7);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const body = [
              marker,
              readReport('i18n-check-report.md'),
              '',
              `**检查状态：${status}** · **提交：** [\`${shortSha}\`](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/commit/${sha})`,
              '',
              `[查看工作流和完整日志](${runUrl})`,
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });

            const existing = comments.find((c) =>
              c.user?.type === 'Bot' && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
