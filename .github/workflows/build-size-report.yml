name: Tauri Renderer Size Report

on:
  pull_request:
    paths:
      - 'src/renderer/**'
      - 'src/tauri/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/build-size-report.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renderer-size:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build Tauri renderer
        run: npm run build:web
      - name: Record renderer bundle sizes
        shell: pwsh
        run: |
          $renderer = (Resolve-Path 'out/renderer').Path
          $sizes = Get-ChildItem -LiteralPath $renderer -Recurse -File | ForEach-Object { @{ path = [System.IO.Path]::GetRelativePath($renderer, $_.FullName); bytes = $_.Length } }
          $sizes | ConvertTo-Json -Depth 3 | Set-Content -LiteralPath renderer-sizes.json -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: tauri-renderer-sizes
          path: renderer-sizes.json
