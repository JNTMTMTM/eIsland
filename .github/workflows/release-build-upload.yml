name: Tauri Release Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Install build dependencies without legacy lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Prepare native FFmpeg binary
        run: node node_modules/ffmpeg-static/install.js
      - name: Publish native plugin resources
        run: npm run plugins:build:tauri
      - name: Test native application services
        run: npm run test:tauri
      - name: Build Tauri NSIS installer
        run: npm run package
      - name: Generate release notes
        run: node --experimental-strip-types scripts/generate-incremental-release-notes.ts -o RELEASE_NOTES.md
      - name: Generate native update manifest
        run: node scripts/tauri/create-update-manifest.mjs
        env:
          EISLAND_TAURI_RELEASE_BASE_URL: ${{ vars.TAURI_RELEASE_BASE_URL }}
      # Electron latest.yml/blockmap uploads are retired; Tauri distribution is a separate pipeline.
      - name: Upload Tauri installer for review
        uses: actions/upload-artifact@v7
        with:
          name: eisland-tauri-windows-x64-${{ github.ref_name }}
          path: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/tauri-latest.json
            RELEASE_NOTES.md
          if-no-files-found: error
