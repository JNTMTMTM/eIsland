<!--
  @file splash.html
  @description eIsland 启动动画窗口 - 灵动岛风格入场动画
  @author 鸡哥
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title></title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
    }

    .splash-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 1000px;
    }

    .island-splash {
        position: relative;
        width: 260px;
        height: 42px;
        background: #000000;
        border-radius: 0 0 22px 22px;
        overflow: hidden;
        opacity: 0;
        transform: scaleX(0) scaleY(1.2);
        transform-origin: center top;
        animation: islandExpand 0.8s cubic-bezier(0.25, 1.06, 0.45, 1) 0.1s forwards;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    @keyframes islandExpand {
        0% {
            opacity: 0;
            transform: scaleX(0) scaleY(1.2);
            border-radius: 50%;
        }
        50% {
            opacity: 1;
            transform: scaleX(1.06) scaleY(0.95);
            border-radius: 0 0 24px 24px;
        }
        75% {
            transform: scaleX(0.98) scaleY(1.02);
        }
        100% {
            opacity: 1;
            transform: scale(1);
            border-radius: 0 0 22px 22px;
        }
    }

    .island-inner {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        animation: fadeInContent 0.5s ease-out 0.6s forwards;
    }

    @keyframes fadeInContent {
        from {
            opacity: 0;
            transform: translateY(4px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .loading-dots {
        display: flex;
        gap: 6px;
        align-items: center;
    }

    .dot {
        width: 6px;
        height: 6px;
        background: rgba(255, 255, 255, 0.6);
        border-radius: 50%;
        animation: dotBounce 1.4s ease-in-out infinite;
    }

    .dot:nth-child(1) {
        animation-delay: 0s;
    }

    .dot:nth-child(2) {
        animation-delay: 0.2s;
    }

    .dot:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes dotBounce {
        0%, 80%, 100% {
            transform: scale(0.8);
            background: rgba(255, 255, 255, 0.4);
        }
        40% {
            transform: scale(1.2);
            background: rgba(255, 255, 255, 0.9);
        }
    }

    .glow-effect {
        position: absolute;
        inset: -20px;
        background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
        opacity: 0;
        animation: glowPulse 2s ease-in-out 0.8s infinite;
        pointer-events: none;
    }

    @keyframes glowPulse {
        0%, 100% {
            opacity: 0.3;
            transform: scale(1);
        }
        50% {
            opacity: 0.6;
            transform: scale(1.1);
        }
    }

    .version-text {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 9px;
        color: rgba(255, 255, 255, 0.3);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        opacity: 0;
        animation: fadeInContent 0.5s ease-out 0.9s forwards;
        letter-spacing: 0.5px;
    }

    .fade-out {
        animation: splashFadeOut 0.4s ease-in forwards !important;
    }

    @keyframes splashFadeOut {
        from {
            opacity: 1;
            transform: scale(1);
        }
        to {
            opacity: 0;
            transform: scale(0.95);
        }
    }
</style>
</head>
<body>
<div class="splash-container">
    <div class="island-splash" id="islandSplash">
        <div class="glow-effect"></div>
        <div class="island-inner">
            <div class="loading-dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
        </div>
        <div class="version-text" id="versionText">eIsland</div>
    </div>
</div>

<script>
    function startFadeOut() {
        const island = document.getElementById('islandSplash');
        if (island) {
            island.classList.add('fade-out');
        }
    }
</script>
</body>
</html>
