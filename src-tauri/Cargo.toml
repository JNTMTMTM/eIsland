[package]
name = "eisland"
version = "27.0.1"
description = "eIsland desktop runtime"
authors = ["JNTMTMTM"]
license = "GPL-3.0"
edition = "2021"

[lib]
name = "eisland_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-ico", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "process", "io-util", "sync", "macros", "fs", "net", "rt-multi-thread"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff"] }
base64 = "0.22"
arboard = "3"
rfd = "0.15"
xcap = "0.9.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "brotli", "deflate", "blocking", "multipart"] }
tiny_http = "0.12"
rand = "0.9"
aes = "0.8"
ctr = "0.9"
md-5 = "0.10"
sha2 = "0.10"
sha1 = "0.10"
hex = "0.4"
walkdir = "2"
sysinfo = "0.37"
futures-util = "0.3"
mailparse = "0.15"
native-tls = "0.2"
imap = "2.4.1"
imap-proto = "0.10.2"
auto-launch = "0.6"
zip = "2"
chrono = { version = "0.4", features = ["clock", "serde"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
hmac = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Foundation", "Graphics_Imaging", "Media_Ocr", "Storage", "Storage_Streams", "Globalization", "Win32_System_WinRT", "Win32_System_Com", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
libloading = "0.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Performance", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
