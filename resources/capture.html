<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>eIsland Screenshot</title>
<link rel="stylesheet" href="./capture.css">
</head>
<body>
<canvas class="capture-canvas capture-bg-canvas" id="bg-canvas"></canvas>
<canvas class="capture-canvas capture-draw-canvas" id="draw-canvas"></canvas>
<canvas class="capture-canvas capture-temp-canvas" id="temp-canvas"></canvas>
<canvas class="capture-canvas capture-mask-canvas" id="mask-canvas"></canvas>

<div class="capture-size-info" id="size-info"></div>

<div class="capture-translate-overlay" id="translateOverlay" role="status" aria-live="polite">
  <span class="capture-translate-spinner" aria-hidden="true"></span>
  <span class="capture-translate-message" id="translateMessage"></span>
</div>

<div class="capture-toolbar" id="toolbar">
  <span class="capture-source-badge" id="captureSourceBadge" data-capture-source="js">使用js</span>
  <button class="tool active" data-tool="select" data-i18n-title="select" title="选区">
    <img class="capture-btn-icon" src="./svg/SLSECTION.svg" alt="" aria-hidden="true">
  </button>
  <button class="tool" data-tool="mosaic" data-i18n-title="mosaic" title="马赛克">
    <img class="capture-btn-icon" src="./svg/MOSAIC.svg" alt="" aria-hidden="true">
  </button>
  <button class="tool" data-tool="line" data-i18n-title="line" title="直线">
    <img class="capture-btn-icon" src="./svg/S_LINE.svg" alt="" aria-hidden="true">
  </button>
  <button class="tool" data-tool="rect" data-i18n-title="rect" title="矩形">
    <img class="capture-btn-icon" src="./svg/RECTANGLE.svg" alt="" aria-hidden="true">
  </button>
  <button class="tool" data-tool="pen" data-i18n-title="pen" title="画笔">
    <img class="capture-btn-icon" src="./svg/PAINTBRUSH.svg" alt="" aria-hidden="true">
  </button>
  <button class="capture-btn-undo" id="btnUndo" data-i18n-title="undo" title="撤销">
    <img class="capture-btn-icon" src="./svg/UNDO.svg" alt="" aria-hidden="true">
  </button>

  <div class="sep"></div>
  <span class="label" data-i18n="color">颜色</span>
  <input class="capture-color-picker" id="colorPicker" type="color" value="#ff4d4f">
  <span class="label" data-i18n="size">粗细</span>
  <select class="capture-size-picker" id="sizePicker">
    <option value="2">2px</option>
    <option value="4" selected>4px</option>
    <option value="6">6px</option>
    <option value="8">8px</option>
    <option value="12">12px</option>
  </select>

  <div class="sep"></div>
  <button id="btnTranslate" data-i18n-title="translate" title="图片翻译">
    <img class="capture-btn-icon" src="./svg/TRANSLATION.svg" alt="" aria-hidden="true">
  </button>
  <button id="btnSave" data-i18n-title="save" title="保存">
    <img class="capture-btn-icon" src="./svg/SAVE.svg" alt="" aria-hidden="true">
  </button>
  <button class="danger" id="btnCancel" data-i18n-title="cancel" title="取消">
    <img class="capture-btn-icon" src="./svg/CANCEL.svg" alt="" aria-hidden="true">
  </button>
  <button class="primary" id="btnCopy" data-i18n-title="done" title="完成">
    <img class="capture-btn-icon" src="./svg/FINISH.svg" alt="" aria-hidden="true">
  </button>
</div>

<script src="./capture.js"></script>
</body>
</html>
